spring.application.name=mailapp-backend
server.port=${PORT:8080}

# Required for Railway (and any reverse proxy): lets Spring Security see the
# original HTTPS scheme and Host header so the OAuth2 redirect_uri is built correctly.
server.forward-headers-strategy=native

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# CORS allowed origin (frontend dev server)
cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}
frontend.url=${FRONTEND_URL:http://localhost:3000}

# OAuth2 Google Client — credentials loaded from .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/gmail.modify

# Session cookie settings — Secure + HttpOnly + SameSite=None
# SameSite=None is required for cross-origin cookie sending (Vercel -> Railway).
# Set BOTH via property (Spring Boot 3.2+ Servlet 6.0) AND programmatically
# in SameSiteCookieConfig.addCookie() for maximum reliability.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=None

# Store OAuth2 authorized clients in memory (default, fine for dev)
spring.security.oauth2.client.registration.google.client-name=Google

# Gemini AI configuration. The API key must remain backend-only.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
